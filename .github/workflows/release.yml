name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія релізу (напр. 0.0.002)'
        required: false
        default: '0.0.002'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Повна історія потрібна, щоб без проблем запушити коміт
          # оновленого update.json назад у master
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          mkdir -p dist

          # Гарантовано виставляємо exec-права скриптам модуля: zip (info-zip)
          # зберігає POSIX-права файлів, але лише ті, що реально є на диску.
          # Якщо exec-біт загубився в git — інсталятор Magisk/KSU все одно
          # виправить права через customize.sh, але краще пакувати коректно.
          chmod 0755 customize.sh service.sh sync_now.sh set_locale.sh action.sh post-fs-data.sh 2>/dev/null || true

          # В архів мають потрапити ЛИШЕ файли модуля (у корені zip):
          # module.prop, customize.sh, *.sh, webroot/, banner.
          # Виключаємо все службове репозиторію.
          zip -r "dist/td2tdr_v${{ steps.version.outputs.VERSION }}.zip" . \
            -x ".git/*" \
               ".github/*" \
               ".gitignore" \
               ".gitattributes" \
               "dist/*" \
               "*.zip" \
               "package.json" \
               "package-lock.json" \
               "node_modules/*" \
               "scripts/*" \
               "README.md"

          # Контроль вмісту архіву — одразу видно зайві файли у логах
          echo "── Вміст ZIP ──"
          unzip -l "dist/td2tdr_v${{ steps.version.outputs.VERSION }}.zip"

      - name: Compute sha256
        id: sha
        run: |
          SHA=$(sha256sum "dist/td2tdr_v${{ steps.version.outputs.VERSION }}.zip" | cut -d' ' -f1)
          echo "SHA256=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256: $SHA"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VER="v${{ steps.version.outputs.VERSION }}"
          # Витягуємо з changelog.md лише секцію цієї версії (окремий
          # python-скрипт — стабільно та без awk-регексів).
          python3 scripts/extract_changelog.py "$VER" > release_body.md
          if [ ! -s release_body.md ]; then
            # Fallback: якщо секції немає (забули оновити changelog),
            # використовуємо весь файл, щоб реліз не лишився без опису.
            echo "⚠️ Секцію $VER не знайдено в changelog.md — використовую весь файл"
            cp changelog.md release_body.md
          fi

      - name: Update update.json
        run: |
          python3 <<'EOF'
          import json
          ver = "${{ steps.version.outputs.VERSION }}"
          vc = int(ver.split('.')[-1])
          with open('update.json') as f:
              data = json.load(f)
          data['version'] = ver
          data['versionCode'] = vc
          data['zipUrl'] = f"https://github.com/${{ github.repository }}/releases/download/v{ver}/td2tdr_v{ver}.zip"
          data['changelog'] = f"https://raw.githubusercontent.com/${{ github.repository }}/master/changelog.md"
          data['sha256'] = "${{ steps.sha.outputs.SHA256 }}"
          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          EOF

      - name: Attach update.json + checksum to release artifacts
        run: |
          # Копія оновленого update.json і файл хеша прикріплюються до релізу,
          # щоб значення було доступне навіть до мержу коміту в master
          cp update.json dist/update.json
          echo "${{ steps.sha.outputs.SHA256 }}  td2tdr_v${{ steps.version.outputs.VERSION }}.zip" > "dist/td2tdr_v${{ steps.version.outputs.VERSION }}.zip.sha256"

      - name: Commit update.json
        run: |
          if git diff --quiet update.json; then
            echo "update.json не змінився — коміт пропущено"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: bump update.json to v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:${GITHUB_REF_NAME:-master}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            dist/td2tdr_v${{ steps.version.outputs.VERSION }}.zip
            dist/td2tdr_v${{ steps.version.outputs.VERSION }}.zip.sha256
            dist/update.json
          body_path: release_body.md
          overwrite_files: true